name: Diagnose Actions Status

on:
  push:
    paths:
      - ".github/workflows/diagnose-actions.yml"

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Query recent workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20"             | jq -r '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha,.created_at,.updated_at] | @tsv'             > .github/actions-status.tsv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions-status.tsv
          git commit -m "test: record Actions status" || true
          git push
