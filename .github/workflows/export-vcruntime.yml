name: Export VCRuntime

on:
  push:
    paths:
      - ".github/workflows/export-vcruntime.yml"

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Collect VCRUNTIME140
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          $vc = (& where.exe VCRUNTIME140.dll 2>$null | Select-Object -First 1)
          if (-not $vc) {
            $vc = Get-ChildItem "C:\Windows\System32" -Filter "VCRUNTIME140.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $vc) { throw "VCRUNTIME140.dll not found" }
          Copy-Item $vc ".\runtime\VCRUNTIME140.dll" -Force
          Get-Item ".\runtime\VCRUNTIME140.dll" | Format-List FullName,Length

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: VCRUNTIME140
          path: runtime
          if-no-files-found: error
          retention-days: 1
