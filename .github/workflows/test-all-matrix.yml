name: Test All Matrix

on:
  push:
    paths:
      - ".github/workflows/test-all-matrix.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prep.outputs.matrix }}
    steps:
      - id: prep
        shell: bash
        run: |
          requested_platform="all"
          case "$requested_platform" in
            windows)
              matrix='{"include":[{"os":"windows-latest","name":"Windows-x64","kind":"windows"}]}'
              ;;
            linux)
              matrix='{"include":[{"os":"ubuntu-latest","name":"Linux-x64","kind":"linux"}]}'
              ;;
            macos)
              matrix='{"include":[{"os":"macos-latest","name":"macOS","kind":"macos"}]}'
              ;;
            all)
              matrix='{"include":[{"os":"windows-latest","name":"Windows-x64","kind":"windows"},{"os":"ubuntu-latest","name":"Linux-x64","kind":"linux"},{"os":"macos-latest","name":"macOS","kind":"macos"}]}'
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  matrix-check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "matrix ok -> ${{ matrix.kind }} / ${{ matrix.name }} / ${{ matrix.os }}"

  mark-pass:
    needs: matrix-check
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write pass marker
        shell: bash
        run: |
          mkdir -p .github
          printf 'all matrix passed: windows, linux, macos\n' > .github/test-all-matrix-pass.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/test-all-matrix-pass.txt
          git diff --cached --quiet || git commit -m "test: all-platform matrix passed"
          git push
