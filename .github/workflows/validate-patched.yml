name: Validate Patched Windows Package

on:
  push:
    paths:
      - ".github/workflows/validate-patched.yml"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Download Aseprite build
        uses: actions/download-artifact@v4
        with:
          repository: Karis-tlg/AseBuilder
          run-id: 36261507045
          name: Aseprite-v1.3.18.6-Windows-x64
          github-token: ${{ github.token }}
          path: package

      - name: Download OpenSSL runtime
        uses: actions/download-artifact@v4
        with:
          repository: Karis-tlg/AseBuilder
          run-id: 36302137617
          name: Windows-Runtime-DLLs
          github-token: ${{ github.token }}
          path: openssl-runtime

      - name: Download VCRUNTIME140
        uses: actions/download-artifact@v4
        with:
          repository: Karis-tlg/AseBuilder
          run-id: 36302199864
          name: VCRUNTIME140
          github-token: ${{ github.token }}
          path: vc-runtime

      - name: Assemble minimal package
        shell: pwsh
        run: |
          Copy-Item ".\openssl-runtime\libcrypto-3-x64.dll" ".\package\libcrypto-3-x64.dll" -Force
          Copy-Item ".\vc-runtime\VCRUNTIME140.dll" ".\package\VCRUNTIME140.dll" -Force
          Get-ChildItem package | Select-Object Name,Length

      - name: Launch with clean PATH
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $version = (& ".\package\aseprite.exe" --version | Out-String).Trim()
            Write-Host $version
            if ($version -notmatch "^Aseprite ") { throw "Unexpected version output: $version" }
          }
          finally {
            $env:PATH = $savedPath
          }

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-v1.3.18.6-Windows-x64-PATCHED-TESTED
          path: package
          if-no-files-found: error
          retention-days: 7
